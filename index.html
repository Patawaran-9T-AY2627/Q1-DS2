<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rate A Movie</title>
</head>
<body style="font-family: monospace; background-color: #f0f0f0; text-align: center; padding: 20px;">

  <!-- Main Banner Header -->
  <div style="background-color: #d7b3ff; color: #fff; padding: 10px; font-weight: bold; width: 400px; margin: 0 auto;">
    RATE A MOVIE (˶ᵔ ᵕ ᵔ˶)
  </div>

  <p>Share your favorite films and your reviews! reviews are well appreciated! (๑ᵔ⤙ᵔ๑)</p>

  <!-- Form Container -->
  <div style="background-color: #fff; width: 400px; margin: 0 auto; padding: 20px; border-radius: 8px; text-align: left;">

    <!-- Movie Icon -->
    <div style="text-align: center; margin-bottom: 15px;">
      <div style="background-color: #d7b3ff; width: 60px; height: 60px; border-radius: 50%; display: inline-line-block; line-height: 60px; font-size: 30px";
      > 🎬
      </div>
    </div>

    <form>
      <!-- Movie Title Input -->
      <div style="margin-bottom: 15px; text-align: center;">
        <input type="text" placeholder="Enter Movie Title" style="width: 90%; padding: 8px; font-family: monospace;" required>
      </div>

      <!-- Genres Section -->
      <div style="margin-bottom: 15px;">
        <strong>Genres to select ★࿐࿔:</strong><br>
        <label><input type="checkbox" name="genre"> Thriller 愛</label>
        <label><input type="checkbox" name="genre"> Comedy .☘︎ </label>
        <label><input type="checkbox" name="genre"> Drama 𖹭</label>
        <label><input type="checkbox" name="genre"> Fantasy 𑣲⋆</label>
        <label><input type="checkbox" name="genre"> Sci-Fi ⋆. 𐙚 ˚</label>
      </div>

      <!-- Rating Section -->
      <div style="margin-bottom: 15px;">
        <strong>Rating ☘︎:</strong><br>
        <label><input type="radio" name="rating">★</label>
        <label><input type="radio" name="rating">★★</label>
        <label><input type="radio" name="rating">★★★</label>
        <label><input type="radio" name="rating">★★★★</label>
        <label><input type="radio" name="rating">★★★★★ </label>
      </div>

      <!-- Review Textarea -->
      <div style="margin-bottom: 15px; text-align: center;">
        <textarea placeholder="Write your review..." style="width: 90%; height: 60px; padding: 8px; font-family: monospace;"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" style="width: 100%; background-color: #d7b3ff; color: #fff; padding: 10px; border: none; font-family: monospace; cursor: pointer;">
        Submit Review
      </button>

      <!-- Footer Link -->
      <p style="font-size: 12px; margin-top: 10px;">
        Movie Review Tips 𖹭.ᐟ: click <a href="https://letterboxd.com/">here ♡</a>
      </p>
    </form>

  </div>

</body>
</html>
